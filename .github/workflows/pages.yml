name: Publish Public Intelligence Snapshot
on:
  push:
    branches: [main]
  schedule:
    - cron: '30 8 * * 1'
  workflow_dispatch:
env:
  BUN_VERSION: "1.4.2"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    name: Collect, validate and stage public edition
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AIRNOW_API_KEY: ${{ secrets.AIRNOW_API_KEY }}
      GITHUB_SHA: ${{ github.sha }}
      LOG_LEVEL: info
      PAGES_BUILD: "1"
      HEADLESS_BROWSER: "1"
      SCRAPE_TIMEOUT_MS: "180000"
      SOURCE_FETCH_TIMEOUT_MS: "60000"
      YT_DLP_VERSION: "2026.08.19"
      YT_DLP_LINUX_SHA256: "58162f9bfdc27458ea47bfcb311cf47028f17d8154a8bf7d689861d46399230a"
      DENO_VERSION: "2.9.7"
      DENO_LINUX_ZIP_SHA256: "c6527f24f4b16031d3ae4fa9f658d5f11534c8d84ce7dc8502420280919c3490"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Generate offline canonical registry
        run: bun run source-discovery
      - name: Run deterministic release gate
        run: bun run validate
      - name: Install pinned transcript dependencies
        timeout-minutes: 5
        run: |
          set -euo pipefail
          umask 077
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          tool_dir="$(mktemp -d "$RUNNER_TEMP/civic-source-tools.XXXXXX")"
          bin_dir="$tool_dir/bin"
          mkdir "$bin_dir"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --tlsv1.2 --connect-timeout 15 --max-time 90 --retry 2 --retry-max-time 120 --max-filesize 52428800 --output "$bin_dir/yt-dlp" "https://github.com/yt-dlp/yt-dlp/releases/download/$YT_DLP_VERSION/yt-dlp_linux"
          printf '%s  %s\n' "$YT_DLP_LINUX_SHA256" "$bin_dir/yt-dlp" | sha256sum --check --strict
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --tlsv1.2 --connect-timeout 15 --max-time 90 --retry 2 --retry-max-time 120 --max-filesize 52428800 --output "$tool_dir/deno.zip" "https://github.com/denoland/deno/releases/download/v$DENO_VERSION/deno-x86_64-unknown-linux-gnu.zip"
          printf '%s  %s\n' "$DENO_LINUX_ZIP_SHA256" "$tool_dir/deno.zip" | sha256sum --check --strict
          test "$(unzip -Z1 "$tool_dir/deno.zip")" = deno
          unzip -p "$tool_dir/deno.zip" deno > "$bin_dir/deno"
          chmod 0755 "$bin_dir/yt-dlp" "$bin_dir/deno"
          printf '%s\n' "$bin_dir" >> "$GITHUB_PATH"
      - name: Verify transcript dependency availability
        timeout-minutes: 1
        run: |
          set -euo pipefail
          yt_dlp_version="$(timeout --signal=TERM --kill-after=5s 15s yt-dlp --ignore-config --version)"
          test "$yt_dlp_version" = "$YT_DLP_VERSION"
          deno_short_version="$(timeout --signal=TERM --kill-after=5s 15s deno -V)"
          test "$deno_short_version" = "deno $DENO_VERSION"
          deno_version="$(timeout --signal=TERM --kill-after=5s 15s deno --version)"
          printf 'yt-dlp %s\n%s\n' "$yt_dlp_version" "$deno_version"
      - name: Collect municipal code candidate
        id: scrape
        env:
          CC_OUTPUT_DIR: ${{ runner.temp }}/municipal-candidate
        run: timeout --signal=TERM --kill-after=20s 18m bun run all
        continue-on-error: true
      - name: Collect live source snapshots
        run: bun run weekly-check
      - name: Discover community events
        run: bun run src/event_discovery.ts
      - name: Merge community calendar
        run: bun run events
      - name: Build recoverable public publication
        env:
          MUNICIPAL_CANDIDATE: ${{ runner.temp }}/municipal-candidate
          MUNICIPAL_CANDIDATE_OUTCOME: ${{ steps.scrape.outcome }}
        run: |
          if [ "$MUNICIPAL_CANDIDATE_OUTCOME" = success ]; then
            bun run pages:export -- --source output --municipal-source "$MUNICIPAL_CANDIDATE" --seed pages-data --output .pages
          else
            bun run pages:export -- --source output --municipal-source "$RUNNER_TEMP/no-municipal-candidate" --seed pages-data --output .pages
          fi
      - name: Validate complete public tree and custody receipt
        run: bun run pages:validate -- .pages
      - name: Real browser render smoke
        env:
          PAGES_SMOKE_DIR: ${{ github.workspace }}/.pages
        run: |
          bun test tests/lane5-render-smoke.test.ts -t 'lane 5: exported pages render cleanly' --timeout 120000
      - uses: actions/configure-pages@v5
      - name: Upload the validated unchanged publication
        uses: actions/upload-pages-artifact@v3
        with:
          path: .pages
  deploy:
    name: Deploy static snapshot
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
