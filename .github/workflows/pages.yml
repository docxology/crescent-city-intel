name: Publish Public Intelligence Snapshot
on:
  push:
    branches: [main]
  schedule:
    - cron: '30 8 * * 1'
  workflow_dispatch:
env:
  BUN_VERSION: "1.4.2"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    name: Collect, validate and stage public edition
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AIRNOW_API_KEY: ${{ secrets.AIRNOW_API_KEY }}
      GITHUB_SHA: ${{ github.sha }}
      LOG_LEVEL: info
      PAGES_BUILD: "1"
      HEADLESS_BROWSER: "1"
      SCRAPE_TIMEOUT_MS: "180000"
      SOURCE_FETCH_TIMEOUT_MS: "60000"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Generate offline canonical registry
        run: bun run source-discovery
      - name: Run deterministic release gate
        run: bun run validate
      - name: Collect municipal code candidate
        id: scrape
        env:
          CC_OUTPUT_DIR: ${{ runner.temp }}/municipal-candidate
        run: timeout --signal=TERM --kill-after=20s 18m bun run all
        continue-on-error: true
      - name: Collect live source snapshots
        run: bun run weekly-check
      - name: Discover community events
        run: bun run src/event_discovery.ts
      - name: Merge community calendar
        run: bun run events
      - name: Build recoverable public publication
        env:
          MUNICIPAL_CANDIDATE: ${{ runner.temp }}/municipal-candidate
          MUNICIPAL_CANDIDATE_OUTCOME: ${{ steps.scrape.outcome }}
        run: |
          if [ "$MUNICIPAL_CANDIDATE_OUTCOME" = success ]; then
            bun run pages:export -- --source output --municipal-source "$MUNICIPAL_CANDIDATE" --seed pages-data --output .pages
          else
            bun run pages:export -- --source output --municipal-source "$RUNNER_TEMP/no-municipal-candidate" --seed pages-data --output .pages
          fi
      - name: Validate complete public tree and custody receipt
        run: bun run pages:validate -- .pages
      - name: Real browser render smoke
        env:
          PAGES_SMOKE_DIR: ${{ github.workspace }}/.pages
        run: |
          bun test tests/lane5-render-smoke.test.ts -t 'lane 5: exported pages render cleanly' --timeout 120000
      - uses: actions/configure-pages@v5
      - name: Upload the validated unchanged publication
        uses: actions/upload-pages-artifact@v3
        with:
          path: .pages
  deploy:
    name: Deploy static snapshot
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
