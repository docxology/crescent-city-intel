name: Publish Public Intelligence Snapshot

on:
  push:
    branches: [main]
  schedule:
    # Refresh the public snapshot after the weekly intelligence cycle window.
    - cron: '30 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Collect and build static snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      AIRNOW_API_KEY: ${{ secrets.AIRNOW_API_KEY }}
      GITHUB_SHA: ${{ github.sha }}
      LOG_LEVEL: info
      SOURCE_DISCOVERY_LIVE_CHECK: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate canonical source registry
        run: bun run source-discovery

      - name: Run deterministic release gate
        run: bun run validate

      - name: Collect live source snapshots
        run: bun run weekly-check
        # Source outages are represented in source-health artifacts and must not
        # prevent Pages from publishing the rest of the honest snapshot.
        continue-on-error: true

      - name: Export public Pages snapshot
        run: bun run pages:export -- --source output --seed pages-data --output .pages

      - name: Validate public Pages snapshot
        run: bun run pages:validate -- .pages

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .pages

  deploy:
    name: Deploy static snapshot
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
