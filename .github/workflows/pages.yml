name: Publish regional snapshot
on:
  push:
    branches: [main]
  schedule:
    - cron: "30 8 * * 1"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run validate
      - run: bun run weekly-check
        env:
          HEADLESS_BROWSER: "1"
      - run: bun run pages:export
      - run: bun run pages:validate -- .pages
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
