name: Pull Request Gate
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pr-gate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gate:
    name: Offline contracts and affected tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BUN_VERSION: "1.4.2"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Chromium for real browser tests
        run: bunx playwright install --with-deps chromium
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Typecheck tests
        run: bun run test:typecheck
      - name: Offline contract checks
        run: bun run validate -- --only=contracts
      - name: Run conservative affected tests
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: |
          BASE=$(git merge-base HEAD "${BASE_REF:-origin/main}" 2>/dev/null || true)
          if [ -n "$BASE" ]; then
            git diff --name-only "$BASE" HEAD > /tmp/changed.txt
          else
            : > /tmp/changed.txt
          fi
          bun run scripts/ci-affected-tests.ts < /tmp/changed.txt
      - name: Real GUI browser smoke
        run: bun run test:browser
