name: Weekly Intelligence Cycle
on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:
    inputs:
      run_scrape:
        description: Run full scrape pipeline with live verification
        required: false
        default: false
        type: boolean
permissions:
  contents: read
  actions: read
concurrency:
  group: weekly-cycle
  cancel-in-progress: false
env:
  BUN_VERSION: "1.4.2"
jobs:
  weekly-health-check:
    name: Tests and current-run monitor health
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Install Chromium for real browser tests
        run: bunx playwright install --with-deps chromium
      - name: Typecheck tests
        run: bun run test:typecheck
      - name: Run full test suite
        run: bun test tests/ --timeout 30000
      - name: Smoke-test every alert monitor
        run: bun run scripts/ci-monitor-smoke.ts
        env:
          AIRNOW_API_KEY: ${{ secrets.AIRNOW_API_KEY }}
        timeout-minutes: 25
      - name: Check news monitor
        run: bun run src/news_monitor.ts
        timeout-minutes: 5
      - name: Check government meetings
        run: bun run src/gov_meeting_monitor.ts
        timeout-minutes: 5
      - name: Upload alert health evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alerts-${{ github.run_id }}
          path: output/alerts/public-source-health.json
          retention-days: 30
  full-scrape:
    name: Acquire verified corpus (manual)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    if: github.event_name == 'workflow_dispatch' && inputs.run_scrape
    needs: weekly-health-check
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - name: Scrape, live verify and export
        run: bun run all
        env:
          RATE_LIMIT_MS: "3000"
        timeout-minutes: 90
      - name: Upload bound corpus inputs
        uses: actions/upload-artifact@v4
        with:
          name: corpus-${{ github.run_id }}
          if-no-files-found: error
          path: |
            output/toc.json
            output/manifest.json
            output/articles/
            output/crescent-city-code.json
            output/verification-report.json
          retention-days: 30
  verify-data-integrity:
    name: Verify transported corpus
    needs: full-scrape
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: corpus-${{ github.run_id }}
          path: output
      - name: Verify downloaded custody before live verification
        run: bun -e 'import { verificationMatchesInputs } from "./src/verify.ts"; const r=await Bun.file("output/verification-report.json").json(); if(!await verificationMatchesInputs(r,"output"))throw new Error("Transported corpus does not match receipt")'
      - name: Current source verification
        run: bun run verify
        timeout-minutes: 8
      - name: Analyze verified corpus
        run: |
          bun run readability
          bun run coverage
      - name: Upload verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ github.run_id }}
          path: |
            output/verification-report.json
            output/readability.json
            output/domain-coverage.json
          if-no-files-found: error
          retention-days: 30
