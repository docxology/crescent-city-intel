services:
  gui:
    build: .
    ports:
      - "127.0.0.1:${CC_GUI_PORT:-3000}:3000"
    environment:
      PORT: "3000"
      HEADLESS_BROWSER: "1"
      CC_OUTPUT_DIR: /app/output
      LOG_LEVEL: info
      OLLAMA_URL: "${OLLAMA_URL:-http://ollama:11434}"
      CHROMA_URL: "${CHROMA_URL:-http://chroma:8000}"
      CRESCENT_CITY_API_KEY: "${CRESCENT_CITY_API_KEY:-}"
      AIRNOW_API_KEY: "${AIRNOW_API_KEY:-}"
      LLM_PROVIDER: "${LLM_PROVIDER:-ollama}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      OPENROUTER_MODEL: "${OPENROUTER_MODEL:-}"
      OPENROUTER_MAX_REQUESTS: "${OPENROUTER_MAX_REQUESTS:-100}"
      EMBEDDING_MODEL: "${EMBEDDING_MODEL:-nomic-embed-text}"
      CHAT_MODEL: "${CHAT_MODEL:-gemma3:4b}"
    volumes:
      - ${CC_OUTPUT_DIR:-./output}:/app/output
    init: true
    stop_grace_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    restart: unless-stopped

  ollama:
    profiles: [llm]
    image: ollama/ollama:0.34.2
    ports:
      - "127.0.0.1:${CC_OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20
    init: true
    stop_grace_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    restart: unless-stopped

  chroma:
    profiles: [llm]
    image: chromadb/chroma:1.5.9
    ports:
      - "127.0.0.1:${CC_CHROMA_PORT:-8001}:8000"
    volumes:
      - chroma_data:/data
    environment:
      CHROMA_PERSIST_PATH: /data
      ANONYMIZED_TELEMETRY: "FALSE"
    init: true
    stop_grace_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    restart: unless-stopped

  ollama-models:
    profiles: [llm]
    image: ollama/ollama:0.34.2
    environment:
      OLLAMA_HOST: http://ollama:11434
      EMBEDDING_MODEL: "${EMBEDDING_MODEL:-nomic-embed-text}"
      CHAT_MODEL: "${CHAT_MODEL:-gemma3:4b}"
    entrypoint: ["/bin/sh", "-c"]
    command: ['ollama pull "$$EMBEDDING_MODEL" && ollama pull "$$CHAT_MODEL"']
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  readiness:
    profiles: [llm]
    build: .
    command: ["bun", "scripts/stack-readiness.ts"]
    environment:
      OLLAMA_URL: http://ollama:11434
      CHROMA_URL: http://chroma:8000
      EMBEDDING_MODEL: "${EMBEDDING_MODEL:-nomic-embed-text}"
      CHAT_MODEL: "${CHAT_MODEL:-gemma3:4b}"
    depends_on:
      ollama-models:
        condition: service_completed_successfully
      chroma:
        condition: service_started
    restart: "no"

volumes:
  ollama_data:
  chroma_data:
