<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>The Quadruplicate — API Documentation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,900;1,400;1,600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400;1,8..60,600&display=swap" rel="stylesheet"><style>:root{--cc:#c41e1e;--rdark:#8b1a1a;--rtint:#f7dcdc;--ink:#000000;--ink-dim:#333333;--ink-faint:#666666;--paper:#ffffff;--paper2:#f2f2f2;--rule:#444444;--rule-light:#888888;--rule-thin:#dddddd;}body{margin:0;background:var(--paper);color:var(--ink)}.docs-red-banner{background:var(--cc);color:#fff;text-align:center;padding:18px 20px 10px}.docs-red-banner h1{font:900 clamp(1.6rem,4vw,2.8rem)/1.05 "Playfair Display",Georgia,serif;letter-spacing:-.03em;margin:0;text-transform:uppercase;color:#fff}.docs-red-banner .docs-sub{font:400 italic .82rem/1.3 "Source Serif 4",Georgia,serif;color:rgba(255,255,255,.85);margin:2px 0 0}.docs-nav{background:#faf8f5;border-bottom:3px double var(--rule);padding:4px 16px;font:500 .74rem/1 Inter,sans-serif;display:flex;gap:0;justify-content:center;flex-wrap:wrap}.docs-nav a{padding:4px 8px;text-decoration:none;color:#0a0a0a;text-transform:uppercase;letter-spacing:.04em}.docs-nav a:hover{color:var(--cc)}.docs-nav span{color:#d0cac4;padding:4px 2px}#swagger-ui{margin-top:0!important}</style>
</head>
<body>
  <div class="docs-red-banner">
    <h1>The Quadruplicate</h1>
    <div class="docs-sub">API Documentation &middot; OpenAPI specification</div>
  </div>
  <div class="docs-nav">
    <a href="/">Public Snapshot</a>
    <span>|</span>
    <a href="/gui/">GUI</a>
    <span>|</span>
    <a href="/gui/docs.html">API Docs</a>
  </div>
  <div id="swagger-ui"></div>
  <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
  <script>
    window.onload = function() {
      window.ui = SwaggerUIBundle({
        url: "/api/openapi.yaml",
        dom_id: '#swagger-ui',
        deepLinking: true,
        presets: [
          SwaggerUIBundle.presets.forApis,
          SwaggerUIBundle.SwaggerUIStandalonePreset
        ],
        layout: "BaseLayout"
      });
    }
  </script>
</body>
</html>
